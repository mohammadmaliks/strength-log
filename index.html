<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Strength Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}</style>
<style>
/* Layout: calm single column. Segmented day switcher on top, soft cards per exercise, large thumb-sized set rows, rest timer floating above the bottom edge. Deep teal accent on cool neutrals. */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#0F1C2E;--muted:#5C6B7C;--line:#E1E6EC;--field:#F4F6F9;--seg:#E6EAEF;
  --accent:#0F766E;--accent-ink:#FFFFFF;--accent-soft:#E1F3F0;
  --gold:#8A5B0A;--gold-soft:#FBF0D9;--warn:#B4441A;
  --shadow:0 1px 2px rgba(15,28,46,.05),0 6px 18px rgba(15,28,46,.05);
  --display:"Manrope","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1118;--surface:#111C27;--ink:#E8EEF4;--muted:#93A1B1;--line:#22303E;--field:#17242F;--seg:#15212C;
    --accent:#4DC9BC;--accent-ink:#06201D;--accent-soft:#123A38;
    --gold:#E7B65A;--gold-soft:#33280F;--warn:#F2A26B;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1118;--surface:#111C27;--ink:#E8EEF4;--muted:#93A1B1;--line:#22303E;--field:#17242F;--seg:#15212C;
  --accent:#4DC9BC;--accent-ink:#06201D;--accent-soft:#123A38;
  --gold:#E7B65A;--gold-soft:#33280F;--warn:#F2A26B;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  font-family:var(--body);font-size:15px;line-height:1.45;background:var(--bg);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.app{max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--display);letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
#todayLbl{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:4px;background:var(--seg);border-radius:14px}
.tabs button{position:relative;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 14px/1 var(--display);cursor:pointer}
.tabs button[aria-current]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.tabs button.did::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
main{padding-bottom:180px}
.eyebrow{margin:22px 0 4px;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
h1.day{font:800 36px/1.05 var(--display);letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance}
.focus{color:var(--muted);margin:0 0 14px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.prog{padding:14px 16px;margin-bottom:12px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.prog-top b{font:700 16px var(--display);color:var(--ink)}
.track{height:8px;border-radius:4px;background:var(--seg);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .25s}
.note-card{padding:14px 16px;margin-bottom:12px;background:var(--accent-soft);border-color:transparent;box-shadow:none}
.note-card b{display:block;font:700 15px var(--display);margin-bottom:2px}
.note-card p{margin:0;font-size:14px;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:12px}
.ex{padding:16px}
.ex.complete{border-color:var(--accent)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ex-t{display:flex;align-items:center;gap:8px;min-width:0}
.ex-t h3{margin:0;font:700 18px/1.2 var(--display);letter-spacing:-.01em;min-width:0}
.badge{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.badge svg{width:13px;height:13px}
.target{flex:none;font:700 13px/1 var(--display);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:6px 10px;white-space:nowrap}
.meta{margin:6px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sethead,.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.sethead{margin:14px 0 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center}
.sets{display:flex;flex-direction:column;gap:8px}
.set .n{font:700 14px var(--display);color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:600 18px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.65;font-weight:500}
.ck{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .12s,border-color .12s}
.ck svg{width:20px;height:20px}
.set.done .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done input{background:var(--accent-soft);border-color:transparent}
.set.need input{border-color:var(--warn)}
.ex-act{display:flex;gap:8px;margin-top:12px}
.ghost{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font:600 13px var(--body);cursor:pointer}
.ghost svg{width:14px;height:14px}
.hint{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--gold-soft);color:var(--ink);font-size:13px}
.primary{width:100%;height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--display);cursor:pointer;margin-top:18px}
h2.sec{font:800 20px/1.1 var(--display);letter-spacing:-.015em;margin:28px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 0}
.stat{padding:14px}
.stat b{display:block;font:800 26px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rows{overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:first-child{border-top:0}
.row b{font-weight:600}
.row .r{text-align:right}
.row .r small{display:block;color:var(--muted);font-size:12px}
.row.pr .r{color:var(--gold);font-weight:600}
.empty{color:var(--muted);padding:16px;background:transparent;border:1px dashed var(--line);border-radius:14px;margin:0}
.sync{font-size:13px;color:var(--muted);margin:0}
details.sess{margin-bottom:8px}
details.sess summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.sess summary::-webkit-details-marker{display:none}
.s-l{min-width:0}.s-l b{font:700 16px/1.2 var(--display)}
.s-l small{display:block;color:var(--muted);font-size:13px}
.s-r{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.s-ex{padding-top:12px;font-size:14px}.s-ex b{font-weight:600}.s-ex div{color:var(--muted);font-variant-numeric:tabular-nums}
.del{margin-top:14px;border:1px solid var(--line);background:transparent;border-radius:10px;height:38px;padding:0 14px;font:600 13px var(--body);cursor:pointer}
.del[data-armed]{border-color:var(--warn);color:var(--warn)}
#rest{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.rest-card{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(15,28,46,.18)}
.ring{position:relative;flex:none;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--seg)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 15px var(--display);font-variant-numeric:tabular-nums}
.rest-txt{flex:1;min-width:0}
.rest-txt b{display:block;font:700 15px var(--display)}
.rest-txt span{display:block;font-size:12px;color:var(--muted)}
.rest-btns{display:flex;flex-direction:column;gap:6px}
.rest-btns .ghost{height:32px;padding:0 12px;justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500}
#toast.up{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){h1.day{font-size:31px}.tabs button{font-size:13px}.rest-card{gap:10px;padding:10px}}
.backup textarea{width:100%;min-height:96px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px}
</style>
</head>
<body><div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span>Strength Log</span>
      <span id="todayLbl"></span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sessions"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="rest" hidden>
  <div class="rest-card">
    <div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="restRing" cx="32" cy="32" r="26"/></svg><span id="restTime">0:00</span></div>
    <div class="rest-txt"><b id="restLabel">Rest</b><span id="restSub">Next set when you are ready</span></div>
    <div class="rest-btns"><button type="button" class="ghost" id="restPlus">+15 s</button><button type="button" class="ghost" id="restSkip">Skip</button></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Program ---------- */
/* Each exercise: [id source (kept stable so earlier logs still match), display name, sets, min reps, max reps, rest seconds, note] */
var DAYS=[
{key:"mon",tab:"Mon",full:"Monday",name:"Lower A",focus:"Quads first. Heavy squats lead the day.",ex:[
  ["Knäböj","Squat",4,4,6,180,"Two warm-up sets first."],
  ["Benpress","Leg Press",3,8,12,150,""],
  ["Benspark","Leg Extension",3,10,15,90,"Optional: drop set on the last set."],
  ["Sittande lårcurl","Seated Leg Curl",3,8,12,90,""],
  ["Stående vadpress","Standing Calf Raise",4,8,12,75,""],
  ["Cable crunch","Cable Crunch",3,10,15,60,""]]},
{key:"tue",tab:"Tue",full:"Tuesday",name:"Push",focus:"Chest, shoulders and triceps.",ex:[
  ["Bänkpress","Bench Press",4,4,6,180,"Two warm-up sets first."],
  ["Lutande hantelpress","Incline Dumbbell Press",3,6,10,150,""],
  ["Sittande axelpress","Seated Shoulder Press",3,6,10,150,""],
  ["Cable fly","Cable Fly",3,10,15,90,""],
  ["Cable lateral raise","Cable Lateral Raise",5,12,20,60,"Optional: drop set on the last set."],
  ["Triceps pushdown","Triceps Pushdown",3,8,12,90,""],
  ["Overhead triceps extension","Overhead Triceps Extension",3,10,15,90,""]]},
{key:"wed",tab:"Wed",full:"Wednesday",name:"Pull",focus:"Back, rear delts and biceps.",ex:[
  ["Viktade chins","Weighted Chin-Up",4,5,8,180,"Enter 0 as the weight for bodyweight."],
  ["Bröststödd rodd","Chest-Supported Row",3,6,10,150,""],
  ["Neutralt latsdrag","Neutral-Grip Lat Pulldown",3,8,12,120,""],
  ["Straight-arm pulldown","Straight-Arm Pulldown",2,12,15,90,""],
  ["Reverse pec deck","Reverse Pec Deck",3,12,20,60,""],
  ["EZ-bar curl","EZ-Bar Curl",3,6,10,90,""],
  ["Lutande hantelcurl","Incline Dumbbell Curl",3,10,15,90,""]]},
{key:"thu",tab:"Thu",full:"Thursday",name:"Lower B",focus:"Hamstrings, glutes and extra quad volume.",ex:[
  ["Rumänska marklyft","Romanian Deadlift",4,6,10,180,"Two warm-up sets first."],
  ["Benpress","Leg Press",3,8,12,150,"Deep range, feet low."],
  ["Bulgarian split squat","Bulgarian Split Squat",3,8,12,120,""],
  ["Sittande lårcurl","Seated Leg Curl",4,10,15,90,""],
  ["Benspark","Leg Extension",2,12,15,90,""],
  ["Sittande vadpress","Seated Calf Raise",4,10,15,75,""],
  ["Cable crunch","Cable Crunch",3,10,15,60,""]]},
{key:"fri",tab:"Fri",full:"Friday",name:"Upper B",focus:"Shoulders, back thickness and arms.",ex:[
  ["Lutande Smith press","Incline Smith Press",3,6,10,150,""],
  ["Bröststödd T-bar rodd","Chest-Supported T-Bar Row",3,8,12,120,""],
  ["Lateral raise i maskin","Machine Lateral Raise",5,12,20,60,"Optional: drop set on the last set."],
  ["Enarms cable lat pulldown","Single-Arm Cable Pulldown",2,10,15,90,""],
  ["Plan bröstpress i maskin","Flat Machine Chest Press",2,8,12,120,""],
  ["Preacher curl","Preacher Curl",3,8,12,90,""],
  ["Overhead triceps extension","Overhead Triceps Extension",3,10,15,90,""],
  ["Hammer curl","Hammer Curl",2,10,15,90,""],
  ["Reverse pec deck","Reverse Pec Deck",2,12,20,60,""]]}
];
var NAME={};
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
DAYS.forEach(function(d){
  d.ex=d.ex.map(function(a){
    var o={id:slug(a[0]),name:a[1],sets:a[2],min:a[3],max:a[4],rest:a[5],note:a[6]};
    NAME[o.id]=o.name;return o;
  });
});
var MAIN_LIFTS=["Knäböj","Bänkpress","Rumänska marklyft","Viktade chins","Sittande axelpress","Bröststödd rodd","Benpress","Lutande hantelpress"].map(slug);

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dLabel(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);try{return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}catch(e){return s;}}
function num(n){try{return n.toLocaleString("en-GB");}catch(e){return String(n);}}
function parseNum(s){var n=parseFloat(String(s).replace(",","."));return isFinite(n)?n:null;}
function fmt(n){return String(Math.round(n*100)/100);}
function setTxt(s){return (s.w===0?"BW":fmt(s.w))+"×"+s.r;}
function score(s){return s.w>0?s.w*(1+s.r/30):s.r;}
function bestOf(a){var b=null;a.forEach(function(s){if(!b||score(s)>score(b))b=s;});return b;}
function dayByKey(k){for(var i=0;i<DAYS.length;i++)if(DAYS[i].key===k)return DAYS[i];return null;}
var $main=document.getElementById("main"),$tabs=document.getElementById("tabs");
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
var MINUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>';

/* ---------- State (this device, mirrored to the account when possible) ---------- */
var KEY="styrkelogg-v1",S={sessions:[],draft:{}};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){var p=JSON.parse(raw);
    if(p&&Array.isArray(p.sessions))S.sessions=p.sessions;
    if(p&&p.draft&&typeof p.draft==="object")S.draft=p.draft;}
}catch(e){}
var saveT=null;
function flush(){clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function persist(){clearTimeout(saveT);saveT=setTimeout(flush,250);}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flush();else wake();});
window.addEventListener("pagehide",flush);
function sortSessions(){S.sessions.sort(function(a,b){return (b.ts||0)-(a.ts||0);});}

function lastFor(id){
  for(var i=0;i<S.sessions.length;i++){var se=S.sessions[i];
    if(se.ex&&se.ex[id]&&se.ex[id].length)return{date:se.date,sets:se.ex[id]};}
  return null;
}
function bestFor(id){
  var b=null;
  S.sessions.forEach(function(se){var x=se.ex&&se.ex[id];
    if(x&&x.length){var c=bestOf(x);if(!b||score(c)>score(b))b=c;}});
  return b;
}
function ensureDraft(day){
  var d=S.draft[day.key];
  if(!d){d=S.draft[day.key]={date:iso(new Date()),start:null,sets:{}};}
  day.ex.forEach(function(e){
    if(!d.sets[e.id]){d.sets[e.id]=[];for(var i=0;i<e.sets;i++)d.sets[e.id].push({w:"",r:"",d:false});}
  });
  return d;
}
function buildSession(day,d,ts){
  var ex={},cnt=0,vol=0;
  day.ex.forEach(function(e){
    var arr=(d.sets[e.id]||[]).filter(function(s){return s.d;}).map(function(s){return{w:parseNum(s.w),r:parseNum(s.r)};})
      .filter(function(s){return s.w!==null&&s.r!==null&&s.r>0;});
    if(arr.length){ex[e.id]=arr;cnt+=arr.length;arr.forEach(function(s){vol+=s.w*s.r;});}
  });
  if(!cnt)return null;
  return{id:d.date+"-"+day.key+"-"+Date.now().toString(36),date:d.date,day:day.key,ts:ts,ex:ex,sets:cnt,vol:Math.round(vol)};
}
/* A workout left open from an earlier date is saved as it was; empty ones are dropped. */
(function(){
  var today=iso(new Date());
  Object.keys(S.draft).forEach(function(k){
    var d=S.draft[k],day=dayByKey(k);
    if(d&&d.date!==today){
      if(day&&d.sets){var se=buildSession(day,d,d.start||Date.now());if(se)S.sessions.push(se);}
      delete S.draft[k];
    }
  });
  sortSessions();flush();
})();

/* ---------- Storage note ---------- */
var syncState="local";
function refreshSyncUI(){}
function syncText(){return "Your log is saved on this device and works offline. Use Backup below to keep a copy.";}
function pushSession(){}
function dropSession(){}

/* ---------- Navigation ---------- */
var view="mon",summary=null;
function todayKey(){var g=new Date().getDay();return g>=1&&g<=5?DAYS[g-1].key:null;}
function route(){
  var h=location.hash.slice(1);
  if(h==="log"||dayByKey(h)){view=h;}
  else{view=todayKey()||"mon";}
}
function weekStartIso(){var n=new Date();return iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)));}
function weekDone(){var mi=weekStartIso(),o={};S.sessions.forEach(function(s){if(s.date>=mi)o[s.day]=true;});return o;}
function renderTabs(){
  var wk=weekDone(),h="";
  DAYS.forEach(function(d){
    h+='<button type="button" data-v="'+d.key+'"'+(view===d.key?' aria-current="page"':"")+(wk[d.key]?' class="did"':"")+'>'+d.tab+'</button>';
  });
  h+='<button type="button" data-v="log"'+(view==="log"?' aria-current="page"':"")+'>Log</button>';
  $tabs.innerHTML=h;
}
$tabs.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  summary=null;view=b.dataset.v;
  if(location.hash!=="#"+view){try{location.hash=view;}catch(e){}}
  render();window.scrollTo(0,0);
});
window.addEventListener("hashchange",function(){var old=view;route();if(old!==view){summary=null;render();window.scrollTo(0,0);}});

/* ---------- Workout view ---------- */
function curDay(){return dayByKey(view);}
function greeting(){var h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}
function restTxt(sec){return sec>=120?(Math.round(sec/60*10)/10)+" min":sec+" s";}
function phFor(last,i){var p=last?(last.sets[i]||last.sets[last.sets.length-1]):null;return{w:p?fmt(p.w):"",r:p?String(p.r):""};}
function rowsHtml(e,sets,last){
  return sets.map(function(s,i){
    var ph=phFor(last,i);
    return '<div class="set'+(s.d?" done":"")+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+
      '<input class="w" inputmode="decimal" autocomplete="off" aria-label="Weight in kg, set '+(i+1)+'" data-ph="'+esc(ph.w)+'" placeholder="'+esc(ph.w||"–")+'" value="'+esc(s.w)+'">'+
      '<input class="r" inputmode="numeric" autocomplete="off" aria-label="Reps, set '+(i+1)+'" data-ph="'+esc(ph.r)+'" placeholder="'+esc(ph.r||"–")+'" value="'+esc(s.r)+'">'+
      '<button type="button" class="ck" aria-pressed="'+(s.d?"true":"false")+'" aria-label="Mark set '+(i+1)+' complete">'+CHECK+'</button></div>';
  }).join("");
}
function cardHtml(e,d){
  var sets=d.sets[e.id],last=lastFor(e.id),best=bestFor(e.id);
  var rule=e.rest>=120?"Last set: 1 rep in reserve":"Last set: to failure";
  var prev=last?"Last time, "+dLabel(last.date)+": "+last.sets.map(setTxt).join(" · "):"First time. Enter your weight and reps.";
  var done=sets.every(function(s){return s.d;});
  var up=done&&sets.every(function(s){return parseNum(s.r)>=e.max;});
  return '<section class="card ex'+(done?" complete":"")+'" data-ex="'+e.id+'">'+
    '<div class="ex-h"><div class="ex-t"><span class="badge"'+(done?"":" hidden")+'>'+CHECK+'</span><h3>'+esc(e.name)+'</h3></div><span class="target">'+e.sets+" × "+e.min+"–"+e.max+'</span></div>'+
    '<p class="meta">'+esc(prev)+(best?" · Best "+esc(setTxt(best)):"")+'</p>'+
    '<p class="meta">'+esc(rule)+(e.note?" · "+esc(e.note):"")+" · Rest "+restTxt(e.rest)+'</p>'+
    '<div class="sethead"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span></span></div>'+
    '<div class="sets">'+rowsHtml(e,sets,last)+'</div>'+
    '<p class="hint"'+(up?"":" hidden")+'>Every set hit the top of the range. Add weight next session.</p>'+
    '<div class="ex-act"><button type="button" class="ghost add">'+PLUS+'Set</button><button type="button" class="ghost rem">'+MINUS+'Set</button></div></section>';
}
function counts(day,d){
  var t=0,n=0;
  day.ex.forEach(function(e){d.sets[e.id].forEach(function(s){t++;if(s.d)n++;});});
  return{t:t,n:n};
}
function elapsed(d){
  if(!d||!d.start)return "";
  var m=Math.max(0,Math.round((Date.now()-d.start)/60000));
  return m<1?"Just started":m+" min";
}
function updateProgress(){
  var day=curDay();if(!day||summary)return;
  var d=S.draft[day.key],c=counts(day,d);
  var a=document.getElementById("progTxt"),b=document.getElementById("progFill"),p=document.getElementById("progPct"),el=document.getElementById("elapsed");
  if(a)a.textContent=c.n+" of "+c.t+" sets";
  if(p)p.textContent=(c.t?Math.round(c.n/c.t*100):0)+"%";
  if(b)b.style.width=(c.t?Math.round(c.n/c.t*100):0)+"%";
  if(el){var t=elapsed(d);el.textContent=t;el.hidden=!t;}
}
setInterval(updateProgress,20000);
function renderDay(day){
  var d=ensureDraft(day),c=counts(day,d),dow=new Date().getDay(),isToday=todayKey()===day.key;
  var pct=c.t?Math.round(c.n/c.t*100):0,el=elapsed(d),h="";
  h+='<p class="eyebrow">'+(isToday?esc(greeting())+" · Today's session":esc(day.full)+" session")+'</p>';
  h+='<h1 class="day">'+esc(day.name)+'</h1><p class="focus">'+esc(day.focus)+'</p>';
  h+='<div class="chips"><span class="chip">'+day.ex.length+' exercises</span><span class="chip">'+c.t+' sets</span><span class="chip" id="elapsed"'+(el?"":" hidden")+'>'+esc(el)+'</span></div>';
  if(dow===0||dow===6)h+='<div class="card note-card"><b>It is a rest day</b><p>Recovery is where the growth happens. Your next session is Monday, Lower A. You can still log here if you train.</p></div>';
  if(!S.sessions.length&&c.n===0)h+='<div class="card note-card"><b>Welcome to Strength Log</b><p>Enter weight and reps, then tap the check to log a set. Leave the fields empty to reuse the numbers from your last session. The rest timer starts on its own.</p></div>';
  h+='<div class="card prog"><div class="prog-top"><span id="progTxt">'+c.n+" of "+c.t+' sets</span><b id="progPct">'+pct+'%</b></div><div class="track"><i id="progFill" style="width:'+pct+'%"></i></div></div>';
  h+='<div class="list">'+day.ex.map(function(e){return cardHtml(e,d);}).join("")+'</div>';
  h+='<button type="button" class="primary" id="finish">Finish and save session</button>';
  $main.innerHTML=h;
}
function findEx(day,id){for(var i=0;i<day.ex.length;i++)if(day.ex[i].id===id)return day.ex[i];return null;}
function updateCard(card,day){
  var d=S.draft[day.key],id=card.dataset.ex,e=findEx(day,id),sets=d.sets[id];
  var done=sets.every(function(s){return s.d;});
  card.classList.toggle("complete",done);
  card.querySelector(".badge").hidden=!done;
  var up=done&&sets.every(function(s){return parseNum(s.r)>=e.max;});
  card.querySelector(".hint").hidden=!up;
}
function refreshRows(card,day){
  var d=S.draft[day.key],id=card.dataset.ex,e=findEx(day,id);
  card.querySelector(".sets").innerHTML=rowsHtml(e,d.sets[id],lastFor(id));
  updateCard(card,day);updateProgress();persist();
}
function toggleSet(card,row){
  var day=curDay(),d=S.draft[day.key],id=card.dataset.ex,i=+row.dataset.i,s=d.sets[id][i],btn=row.querySelector(".ck");
  unlockAudio();wake();
  if(s.d){
    s.d=false;row.classList.remove("done");btn.setAttribute("aria-pressed","false");
  }else{
    var wi=row.querySelector(".w"),ri=row.querySelector(".r");
    var wv=wi.value.trim()||wi.dataset.ph,rv=ri.value.trim()||ri.dataset.ph;
    if(parseNum(wv)===null||parseNum(rv)===null||parseNum(rv)<1){
      row.classList.add("need");setTimeout(function(){row.classList.remove("need");},1400);
      (parseNum(wv)===null?wi:ri).focus();return;
    }
    wi.value=wv;ri.value=rv;s.w=wv;s.r=rv;s.d=true;
    row.classList.add("done");btn.setAttribute("aria-pressed","true");
    if(!d.start)d.start=Date.now();
    startRest(findEx(day,id).rest);
  }
  updateCard(card,day);updateProgress();persist();
}
function finishWorkout(day,d){
  var before={},prs=[],hints=[];
  day.ex.forEach(function(e){before[e.id]=bestFor(e.id);});
  var se=buildSession(day,d,Date.now());
  if(!se)return;
  day.ex.forEach(function(e){
    var arr=se.ex[e.id];if(!arr)return;
    var b=bestOf(arr);
    if(before[e.id]&&score(b)>score(before[e.id]))prs.push({name:e.name,txt:(b.w===0?"Bodyweight":fmt(b.w)+" kg")+" × "+b.r});
    var full=d.sets[e.id].length>=e.sets&&arr.length>=d.sets[e.id].length&&arr.every(function(s){return s.r>=e.max;});
    if(full)hints.push(e.name);
  });
  S.sessions.push(se);sortSessions();
  delete S.draft[day.key];flush();pushSession(se);
  hideRest();
  summary={name:day.name,date:se.date,sets:se.sets,vol:se.vol,n:Object.keys(se.ex).length,prs:prs,hints:hints};
  render();window.scrollTo(0,0);
}
function renderSummary(){
  var s=summary,h='<p class="eyebrow">Nice work</p><h1 class="day">Session saved</h1><p class="focus">'+esc(s.name)+" · "+esc(dLabel(s.date))+'</p>';
  h+='<div class="stats"><div class="card stat"><b>'+s.sets+'</b><span>sets</span></div><div class="card stat"><b>'+num(s.vol)+'</b><span>kg volume</span></div><div class="card stat"><b>'+s.n+'</b><span>exercises</span></div></div>';
  if(s.prs.length){h+='<h2 class="sec">New personal records</h2><div class="card rows">'+s.prs.map(function(x){return '<div class="row pr"><b>'+esc(x.name)+'</b><span class="r">'+esc(x.txt)+'</span></div>';}).join("")+'</div>';}
  if(s.hints.length){h+='<h2 class="sec">Add weight next time</h2><div class="card rows">'+s.hints.map(function(x){return '<div class="row"><b>'+esc(x)+'</b><span class="r"><small>Top of the range</small></span></div>';}).join("")+'</div>';}
  h+='<button type="button" class="primary" id="toLog">View your log</button>';
  $main.innerHTML=h;
}

/* ---------- Log view ---------- */
function renderLog(){
  var mi=weekStartIso(),ws=0,wsets=0,wvol=0;
  S.sessions.forEach(function(s){if(s.date>=mi){ws++;wsets+=s.sets||0;wvol+=s.vol||0;}});
  var h='<p class="eyebrow">Your progress</p><h1 class="day">Log</h1><p class="sync" id="syncMsg">'+esc(syncText())+'</p>';
  h+='<h2 class="sec">This week</h2><div class="stats" style="margin-top:0"><div class="card stat"><b>'+ws+" / 5</b><span>sessions</span></div><div class=\"card stat\"><b>"+wsets+'</b><span>sets</span></div><div class="card stat"><b>'+num(wvol)+'</b><span>kg volume</span></div></div>';
  h+='<h2 class="sec">Personal records</h2>';
  var rows=[];
  MAIN_LIFTS.forEach(function(id){
    var b=bestFor(id);
    if(b)rows.push('<div class="row"><b>'+esc(NAME[id])+'</b><span class="r">'+(b.w===0?"BW":fmt(b.w)+" kg")+" × "+b.r+(b.w>0?"<small>Est. 1RM "+Math.round(b.w*(1+b.r/30))+" kg</small>":"")+'</span></div>');
  });
  h+=rows.length?'<div class="card rows">'+rows.join("")+'</div>':'<p class="empty">Your records will appear here after your first session.</p>';
  h+='<h2 class="sec">Backup</h2><div class="card note-card backup"><b>Keep a copy of your log</b><p>Your log lives on this device. Copy a backup now and then and paste it into Notes. You can restore it here later.</p><div class="ex-act"><button type="button" class="ghost" id="bkCopy">Copy backup</button><button type="button" class="ghost" id="bkOpen">Restore</button></div><div id="bkBox" hidden><textarea id="bkText" aria-label="Backup text" spellcheck="false"></textarea><div class="ex-act"><button type="button" class="ghost" id="bkRestore">Restore from text</button></div></div></div>';
  h+='<h2 class="sec">Sessions</h2>';
  if(!S.sessions.length)h+='<p class="empty">No sessions yet. Open a day and log your first one.</p>';
  S.sessions.forEach(function(se){
    var day=dayByKey(se.day);
    h+='<details class="card sess"><summary><span class="s-l"><b>'+esc(day?day.name:se.day)+'</b><small>'+esc(dLabel(se.date))+'</small></span><span class="s-r">'+se.sets+" sets<br>"+num(se.vol||0)+' kg</span></summary><div class="s-body">';
    Object.keys(se.ex).forEach(function(id){
      h+='<div class="s-ex"><b>'+esc(NAME[id]||id)+'</b><div>'+se.ex[id].map(setTxt).join(" · ")+'</div></div>';
    });
    h+='<button type="button" class="del" data-id="'+esc(se.id)+'">Delete session</button></div></details>';
  });
  $main.innerHTML=h;
}

/* ---------- Render ---------- */
function render(){
  renderTabs();
  if(summary)renderSummary();
  else if(view==="log")renderLog();
  else renderDay(curDay());
}

/* ---------- Events ---------- */
$main.addEventListener("input",function(ev){
  var inp=ev.target;if(!inp.matches||!inp.matches(".w,.r"))return;
  var row=inp.closest(".set"),card=inp.closest(".ex"),day=curDay();if(!row||!card||!day)return;
  var s=S.draft[day.key].sets[card.dataset.ex][+row.dataset.i];
  if(inp.classList.contains("w"))s.w=inp.value;else s.r=inp.value;
  persist();
});
$main.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var day=curDay();
  if(b.classList.contains("ck")){toggleSet(b.closest(".ex"),b.closest(".set"));return;}
  if(b.classList.contains("add")||b.classList.contains("rem")){
    var card=b.closest(".ex"),arr=S.draft[day.key].sets[card.dataset.ex];
    if(b.classList.contains("add"))arr.push({w:"",r:"",d:false});
    else if(arr.length>1)arr.pop();
    refreshRows(card,day);return;
  }
  if(b.id==="finish"){
    var d=S.draft[day.key],c=counts(day,d);
    if(c.n===0){toast("Log at least one set first.");return;}
    if(c.n<c.t&&!b.dataset.armed){
      b.dataset.armed="1";b.textContent=(c.t-c.n)+" sets left. Tap again to save anyway";
      setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent="Finish and save session";}},4000);return;
    }
    finishWorkout(day,d);return;
  }
  if(b.id==="bkCopy"){
    var txt=JSON.stringify({app:"strength-log",v:1,sessions:S.sessions}),box=document.getElementById("bkBox"),ta=document.getElementById("bkText");
    var okCopy=function(){toast("Backup copied.");};
    var manual=function(){box.hidden=false;ta.value=txt;ta.focus();ta.select();toast("Select and copy the text.");};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(okCopy,manual);}else manual();}catch(e){manual();}
    return;
  }
  if(b.id==="bkOpen"){var bx=document.getElementById("bkBox"),bt=document.getElementById("bkText");bx.hidden=!bx.hidden;if(!bx.hidden){bt.value="";bt.focus();}return;}
  if(b.id==="bkRestore"){
    try{
      var obj=JSON.parse(document.getElementById("bkText").value.trim());
      if(!obj||!Array.isArray(obj.sessions))throw new Error("bad");
      var have={},add=0;S.sessions.forEach(function(x){have[x.id]=1;});
      obj.sessions.forEach(function(x){if(x&&x.id&&x.ex&&!have[x.id]){S.sessions.push(x);add++;}});
      sortSessions();flush();render();toast(add+" sessions restored.");
    }catch(e){toast("That does not look like a backup.");}
    return;
  }
  if(b.id==="toLog"){summary=null;view="log";try{location.hash="log";}catch(e){}render();window.scrollTo(0,0);return;}
  if(b.classList.contains("del")){
    if(!b.dataset.armed){
      b.dataset.armed="1";b.textContent="Tap again to delete";
      setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent="Delete session";}},3000);return;
    }
    var id=b.dataset.id;
    S.sessions=S.sessions.filter(function(s){return s.id!==id;});
    flush();dropSession(id);render();toast("Session deleted.");
  }
});

/* ---------- Rest timer, sound, wake lock, toast ---------- */
var $rest=document.getElementById("rest"),$rt=document.getElementById("restTime"),$ring=document.getElementById("restRing"),$rl=document.getElementById("restLabel"),$rs=document.getElementById("restSub");
var CIRC=163.4,rest={end:0,total:0,fired:false,iv:null};
function mmss(s){return Math.floor(s/60)+":"+pad(s%60);}
function resetLabels(){$rl.textContent="Rest";$rs.textContent="Next set when you are ready";}
function startRest(sec){
  rest.end=Date.now()+sec*1000;rest.total=sec;rest.fired=false;
  $rest.hidden=false;resetLabels();
  clearInterval(rest.iv);rest.iv=setInterval(tick,250);tick();
  document.getElementById("toast").classList.add("up");
}
function hideRest(){clearInterval(rest.iv);$rest.hidden=true;document.getElementById("toast").classList.remove("up");}
function tick(){
  var left=Math.ceil((rest.end-Date.now())/1000);
  if(left>0){$rt.textContent=mmss(left);$ring.style.strokeDashoffset=String(CIRC*(1-Math.max(0,Math.min(1,left/rest.total))));return;}
  $rt.textContent="0:00";$ring.style.strokeDashoffset=String(CIRC);$rl.textContent="Time for your next set";$rs.textContent="Take it when you feel ready";
  if(!rest.fired){rest.fired=true;beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
  if(left<-10)hideRest();
}
document.getElementById("restPlus").addEventListener("click",function(){
  unlockAudio();rest.end=Math.max(rest.end,Date.now())+15000;rest.total+=15;rest.fired=false;resetLabels();tick();
});
document.getElementById("restSkip").addEventListener("click",hideRest);
var ac=null;
function unlockAudio(){try{if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}if(ac&&ac.state==="suspended")ac.resume();}catch(e){}}
function beep(){
  try{
    if(!ac)return;
    [0,0.22].forEach(function(t){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="sine";o.frequency.value=880;g.gain.value=0.0001;
      o.connect(g);g.connect(ac.destination);
      var n=ac.currentTime+t;
      g.gain.exponentialRampToValueAtTime(0.25,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+0.18);
      o.start(n);o.stop(n+0.2);
    });
  }catch(e){}
}
var lock=null;
function wake(){
  try{
    if(navigator.wakeLock&&document.visibilityState==="visible"&&(!lock||lock.released)){
      navigator.wakeLock.request("screen").then(function(l){lock=l;}).catch(function(){});
    }
  }catch(e){}
}
var toastT=null;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}

/* ---------- Start ---------- */
try{document.getElementById("todayLbl").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){}
function registerSW(){if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}}
route();render();registerSW();
})();
</script>
